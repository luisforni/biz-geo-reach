services:
  postgres:
    image: postgis/postgis:15-3.4
    environment:
      POSTGRES_DB: commerce_finder
      POSTGRES_USER: commerce
      POSTGRES_PASSWORD: commerce_pass
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./init.sql:/docker-entrypoint-initdb.d/init.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U commerce -d commerce_finder"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - internal

  redis:
    image: redis:7-alpine
    command: redis-server --save 60 1 --loglevel warning
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    networks:
      - internal

  backend:
    build:
      context: ./geo-finder-api
      dockerfile: Dockerfile
    environment:
      PORT: "8080"
      DATABASE_URL: "postgres://commerce:commerce_pass@postgres:5432/commerce_finder?sslmode=disable"
      REDIS_URL: "redis://redis:6379"
      OVERPASS_URL: "https://overpass-api.de/api/interpreter"
      RATE_LIMIT_RPM: "60"
      CACHE_TTL: "1h"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - internal
    restart: unless-stopped

  frontend:
    build:
      context: ./geo-finder-ui
      dockerfile: Dockerfile
    environment:
      VITE_API_URL: "/api"
    networks:
      - internal

  nginx:
    image: nginx:1.25-alpine
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
    ports:
      - "8090:80"
    depends_on:
      - backend
      - frontend
    networks:
      - internal
    restart: unless-stopped

  campaign-service:
    build:
      context: ./campaign-api
      dockerfile: Dockerfile
    environment:
      API_KEY: "${CAMPAIGN_SERVICE_API_KEY:-change-me}"
      DATABASE_URL: "sqlite+aiosqlite:///./data/campaigns.db"
      WHATSAPP_GATEWAY_URL: "http://whatsapp-gateway:3002"
      WHATSAPP_GATEWAY_API_KEY: "${WHATSAPP_GATEWAY_API_KEY:-change-me}"
      AI_SERVICE_URL: "http://ai-service:8002"
      AI_SERVICE_API_KEY: "${AI_SERVICE_API_KEY:-change-me}"
      RESPONSE_TIMEOUT_HOURS: "24"
      WORKER_POLL_INTERVAL_SECONDS: "10"
    ports:
      - "8010:8001"
    volumes:
      - campaign_data:/app/data
    networks:
      - internal
    restart: unless-stopped

  whatsapp-gateway:
    build:
      context: ./whatsapp-gateway
      dockerfile: Dockerfile
    environment:
      PORT: "3002"
      API_KEY: "${WHATSAPP_GATEWAY_API_KEY:-change-me}"
      CAMPAIGN_SERVICE_URL: "http://campaign-service:8001"
      CAMPAIGN_SERVICE_API_KEY: "${CAMPAIGN_SERVICE_API_KEY:-change-me}"
      SEND_RATE_LIMIT_PER_MINUTE: "10"
    ports:
      - "3003:3002"
    volumes:
      - whatsapp_auth:/app/auth_state
    networks:
      - internal
    restart: unless-stopped

  ai-service:
    build:
      context: ./ai-service
      dockerfile: Dockerfile
    environment:
      API_KEY: "${AI_SERVICE_API_KEY:-change-me}"
      OLLAMA_URL: "http://host.docker.internal:11434"
      OLLAMA_MODEL: "${OLLAMA_MODEL:-llama3.2}"
      TEMPERATURE: "0.7"
      TOP_P: "0.9"
    # host.docker.internal resolves to the host machine on Docker Desktop (Windows/Mac).
    # On Linux Docker Engine, extra_hosts is needed instead.
    extra_hosts:
      - "host.docker.internal:host-gateway"
    networks:
      - internal
    restart: unless-stopped

volumes:
  postgres_data:
  redis_data:
  campaign_data:
  whatsapp_auth:

networks:
  internal:
    driver: bridge
